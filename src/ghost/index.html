<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' polish:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>ScreenPolish cursor</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        cursor: none;
      }
      /*
        The window spans a whole display and never moves. Only this layer moves,
        by transform, so the sprite is repainted by the compositor instead of by
        a SetWindowPos round trip through the main process.
      */
      #ghost {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        will-change: transform;
        transform: translate3d(-999px, -999px, 0);
      }
      /*
        Each sprite draws in its own user units with the hot spot at (0,0), so the
        svg's top-left corner is at the viewBox origin. Pulling the element back by
        that origin puts the hot spot exactly on the layer origin, which is exactly
        on the real pointer. The inline left/top on each svg is its viewBox min.
      */
      .skin {
        position: absolute;
        display: none;
        overflow: visible;
        filter: drop-shadow(0 1.5px 2.2px rgba(0, 0, 0, 0.45));
      }
      .skin.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="ghost">
      <!-- Same soft hand silhouette and palette as the exported canvas cursor.
           Hotspot stays at (0,0); no idle movement or global system-cursor change. -->
      <svg class="skin" data-skin="hand" style="left: -9px; top: -3px; filter: drop-shadow(0 0.8px 1.3px rgba(0,0,0,0.20))" width="22" height="30" viewBox="-9 -3 22 30" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hand-body" gradientUnits="userSpaceOnUse" x1="-3" y1="0" x2="6" y2="22">
            <stop offset="0" stop-color="#fffefa" />
            <stop offset="0.6" stop-color="#f8f7f3" />
            <stop offset="1" stop-color="#dedfe2" />
          </linearGradient>
        </defs>
        <path d="M0 0 C-1.1 0 -1.85 .85 -1.85 2 L-1.85 12 -4.1 9.85 C-5.05 8.95 -6.4 9.25 -6.65 10.35 C-6.85 11.05 -6.45 11.7 -5.9 12.55 L-2.6 18.3 C-1.8 19.75 -.4 20.4 -.2 22 L7.2 22 C7.2 20.6 9.2 18.65 9.2 16.4 L9.2 10.1 C9.2 8.05 6.5 8.05 6.5 10.1 L6.5 8.55 C6.5 6.65 3.8 6.65 3.8 8.55 L3.8 7.6 C3.8 5.75 1.85 5.75 1.85 7.6 L1.85 2 C1.85 .85 1.1 0 0 0 Z" fill="url(#hand-body)" stroke="#30343b" stroke-width="1.05" stroke-linejoin="round" stroke-linecap="round" />
        <path d="M1.85 8.4 V12.7 M3.8 9.1 V13 M6.5 10.7 V13.3" fill="none" stroke="#30343b" stroke-width=".75" stroke-linecap="round" />
      </svg>

      <!-- Beveled arrow: gradient body, inner highlight on the top-left
           edge, inner shade on the bottom-right, lit from the top-left. -->
      <svg class="skin" data-skin="agent" style="left: -3px; top: -3px" width="21" height="28" viewBox="-3 -3 21 28" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L0 17.6 L4.6 13.4 L7.7 20 L10.6 18.9 L7.7 12.5 L13.6 12.1 Z" fill="none" stroke="rgba(14,20,28,0.55)" stroke-width="3.5" stroke-linejoin="round" />
        <path d="M0 0 L0 17.6 L4.6 13.4 L7.7 20 L10.6 18.9 L7.7 12.5 L13.6 12.1 Z" fill="#7f77dd" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" />
      </svg>

      <svg class="skin" data-skin="arrow" style="left: -3px; top: -3px" width="21" height="28" viewBox="-3 -3 21 28" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="arrow-body" x1="0" y1="0" x2="0.8" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.52" stop-color="#f3f4f7" />
            <stop offset="1" stop-color="#c4c8d2" />
          </linearGradient>
          <clipPath id="arrow-clip">
            <path d="M0 0 L0 18 L4.75 13.4 L8.2 21.3 L11.95 19.66 L8.5 11.95 L14.83 11.66 Z" />
          </clipPath>
        </defs>
        <path
          d="M0 0 L0 18 L4.75 13.4 L8.2 21.3 L11.95 19.66 L8.5 11.95 L14.83 11.66 Z"
          fill="url(#arrow-body)"
          stroke="#1b1e25"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <g clip-path="url(#arrow-clip)" fill="none" stroke-linejoin="round">
          <path d="M0 0 L0 18 L4.75 13.4 L8.2 21.3 L11.95 19.66 L8.5 11.95 L14.83 11.66 Z" transform="translate(1.05 1.05)" stroke="#ffffff" stroke-width="1.7" opacity="0.95" />
          <path d="M0 0 L0 18 L4.75 13.4 L8.2 21.3 L11.95 19.66 L8.5 11.95 L14.83 11.66 Z" transform="translate(-1.05 -1.05)" stroke="#8c92a1" stroke-width="1.5" opacity="0.6" />
        </g>
      </svg>

      <!-- Bobbing: the editor's rounded white arrow. It bobs in the edit, not live. -->
      <svg class="skin" data-skin="bobbing" style="left: -2px; top: -2px" width="20" height="25" viewBox="-2 -2 20 25" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L2.64 19.8 Q3.08 21.34 4.4 20.02 L8.36 14.74 L15.18 14.08 Q17.16 13.86 15.62 12.32 Z" fill="#ffffff" stroke="#171717" stroke-width="1.2" stroke-linejoin="round" />
      </svg>

      <!-- Centred skins: hot spot is the middle, so the viewBox min is negative on both axes. -->
      <!-- Halo: a thin ring around a small dot, as the editor draws it at rest. -->
      <svg class="skin" data-skin="halo" style="left: -14px; top: -14px" width="28" height="28" viewBox="-14 -14 28 28" xmlns="http://www.w3.org/2000/svg">
        <circle cx="0" cy="0" r="9.5" fill="rgba(255,255,255,0.06)" stroke="rgba(14,20,28,0.32)" stroke-width="3.4" />
        <circle cx="0" cy="0" r="9.5" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.6" />
        <circle cx="0" cy="0" r="2.6" fill="#ffffff" stroke="rgba(14,20,28,0.55)" stroke-width="0.9" />
      </svg>

      <!-- Star: a gold four-pointed sparkle in a soft glow. -->
      <svg class="skin" data-skin="star" style="left: -17px; top: -17px" width="34" height="34" viewBox="-17 -17 34 34" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="star-glow">
            <stop offset="0" stop-color="#f8d67a" stop-opacity="0.5" />
            <stop offset="1" stop-color="#f5c542" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="star-body">
            <stop offset="0" stop-color="#fef9ec" />
            <stop offset="0.35" stop-color="#f7d468" />
            <stop offset="1" stop-color="#c49e35" />
          </radialGradient>
        </defs>
        <circle cx="0" cy="0" r="16" fill="url(#star-glow)" />
        <path d="M0 -10 Q1.13 -1.13 10 0 Q1.13 1.13 0 10 Q-1.13 1.13 -10 0 Q-1.13 -1.13 0 -10 Z" fill="url(#star-body)" stroke="rgba(98,79,26,0.6)" stroke-width="0.8" stroke-linejoin="round" />
      </svg>

      <!-- Shaded sphere: radial gradient off-centre plus a specular dot. -->
      <svg class="skin" data-skin="dot" style="left: -11px; top: -11px" width="22" height="22" viewBox="-11 -11 22 22" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="dot-body" cx="0.34" cy="0.3" r="0.78">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.5" stop-color="#eceef3" />
            <stop offset="1" stop-color="#a9afbe" />
          </radialGradient>
        </defs>
        <circle cx="0" cy="0" r="6.4" fill="url(#dot-body)" stroke="#1b1e25" stroke-width="1.7" />
        <ellipse cx="-2.1" cy="-2.6" rx="2.2" ry="1.5" fill="#ffffff" opacity="0.85" transform="rotate(-32)" />
      </svg>

    </div>
    <script type="module">
      // Coordinates arrive two ways. Forwarded mouse moves are the fast path: they
      // land in this renderer at the native pointer rate with no IPC. The main
      // process also pushes a poll so the sprite cannot get stranded when
      // forwarding stops. How the two hand over is decided in follow.ts.
      import { placeFromPoll } from './follow.ts'

      const ghost = document.getElementById('ghost')
      const params = new URLSearchParams(location.hash.slice(1))
      const skin = params.get('skin') || 'hand'
      const origin = { x: Number(params.get('x') || 0), y: Number(params.get('y') || 0) }

      const chosen = document.querySelector(`.skin[data-skin="${CSS.escape(skin)}"]`) || document.querySelector('.skin')
      if (chosen) chosen.classList.add('on')

      let lastLocal = 0
      function place(x, y) {
        ghost.style.visibility = 'visible'
        ghost.style.transform = `translate3d(${x}px, ${y}px, 0)`
      }

      window.addEventListener('mousemove', (e) => {
        lastLocal = performance.now()
        place(e.clientX, e.clientY)
      })

      window.polishGhost?.onPoint((p) => {
        const next = placeFromPoll(performance.now(), lastLocal, p, origin, { width: window.innerWidth, height: window.innerHeight })
        if (next.action === 'place') place(next.x, next.y)
        else if (next.action === 'hide') ghost.style.visibility = 'hidden'
      })
    </script>
  </body>
</html>
