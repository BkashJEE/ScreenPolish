appId: com.bikashjoshi.screenpolish
productName: ScreenPolish
directories:
  output: release
# Where the Windows app looks for updates (main/updater.ts): published GitHub
# releases. Builds still run with --publish never; CI attaches the files,
# including latest.yml, which is what the updater reads.
publish:
  provider: github
  owner: BkashJEE
  repo: ScreenPolish
  releaseType: release
files:
  - out/**
  - package.json
  - resources/icon.png
  - resources/icon-256.png
  - resources/tray.png
  - resources/backgrounds/**
  - resources/music/**
  - resources/fonts/**
  - resources/segmenter/**
asarUnpack:
  - node_modules/uiohook-napi/**
  - node_modules/koffi/**
win:
  target: [nsis]
  icon: resources/icon.ico
  extraResources:
    # Licence texts first; the win-only koffi entry on the windows branch follows ffmpeg.exe.
    # ffmpeg-static names the licence after the binary, so on Windows it is
    # ffmpeg.exe.LICENSE. A missing source here is only a warning, which is how
    # the Windows package shipped GPL ffmpeg with no licence beside it.
    - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
      to: ffmpeg.LICENSE
    - from: THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
    - from: node_modules/ffmpeg-static/ffmpeg.exe
      to: ffmpeg.exe
    # Captions: whisper.cpp's prebuilt whisper-cli.exe with the DLLs it loads
    # (whisper, ggml, ggml-base, the ggml-cpu-* variants), and the English base
    # model, from scripts/fetch-whisper.sh.
    - from: vendor/whisper
      to: whisper
      filter: [whisper-cli.exe, whisper.dll, 'ggml*.dll', ggml-base.en.bin]
    - from: resources/licenses/whisper.cpp-LICENSE.txt
      to: whisper/LICENSE
mac:
  target: [dmg, zip]
  icon: resources/icon.png
  category: public.app-category.video
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSCameraUsageDescription: ScreenPolish records your camera for the webcam bubble.
    NSMicrophoneUsageDescription: ScreenPolish records your microphone.
    NSScreenCaptureUsageDescription: ScreenPolish records your screen.
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.LICENSE
      to: ffmpeg.LICENSE
    - from: THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
    - from: node_modules/ffmpeg-static/ffmpeg
      to: ffmpeg
    # Captions: a universal (arm64 + x86_64) whisper-cli built with Metal and
    # the English base model, from scripts/fetch-whisper.sh.
    - from: vendor/whisper
      to: whisper
      filter: [whisper-cli, ggml-base.en.bin]
    - from: resources/licenses/whisper.cpp-LICENSE.txt
      to: whisper/LICENSE
linux:
  # pacman for Arch and Omarchy; AppImage so every other distribution has
  # something to run without packaging work.
  target: [pacman, AppImage]
  icon: resources/icon.png
  category: AudioVideo
  synopsis: Screen recorder with automatic polish
  # Required by the pacman/deb packagers. Same identity as the repo's commits.
  maintainer: Bikash Joshi <bkashjee@gmail.com>
  # Without this the binary takes the package name ("polish"); the CLI is the
  # point on Linux, so it gets the product's name.
  executableName: screenpolish
  # Hyprland matches windows by app_id/WM_CLASS, which Electron takes from the
  # desktop entry name (set as `desktopName` in package.json). Without this a
  # `windowrule` in a user's hyprland.conf cannot target ScreenPolish at all.
  syncDesktopName: true
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.LICENSE
      to: ffmpeg.LICENSE
    - from: THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
    - from: node_modules/ffmpeg-static/ffmpeg
      to: ffmpeg
    # Captions: whisper-cli and the English base model, from scripts/fetch-whisper.sh.
    - from: vendor/whisper
      to: whisper
      filter: [whisper-cli, ggml-base.en.bin]
    - from: resources/licenses/whisper.cpp-LICENSE.txt
      to: whisper/LICENSE
pacman:
  # The package is `screenpolish`, not `polish` (which is the npm package name).
  packageName: screenpolish
  artifactName: ${productName}-${version}.${ext}
  # electron-builder's default dependency list is Debian-flavoured and several of
  # those names do not exist in the Arch repositories (libappindicator-gtk3 is
  # AUR-only), which would make `pacman -U` refuse the package outright. These
  # are the Arch names for what Electron actually needs. ffmpeg is not listed:
  # the app ships its own binary in resources/.
  depends: [gtk3, nss, alsa-lib, libnotify, libxss]
dmg:
  sign: false
nsis:
  # No spaces in the installer's name: GitHub turns them into dots on upload,
  # and latest.yml would then point at a file that is not there.
  artifactName: ScreenPolish-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
