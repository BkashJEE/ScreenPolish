name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build: npx electron-builder --win nsis --publish never
          - os: macos-latest
            name: mac
            build: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
          - os: ubuntu-latest
            name: linux
            build: npx electron-builder --linux pacman AppImage --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The pacman target shells out to bsdtar, which the Ubuntu runner image
      # does not install by default. The X11 headers are for uiohook-napi:
      # Linux never loads it, but electron-builder still rebuilds it, and
      # without them the whole Linux package fails to build.
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libx11-dev libxrandr-dev libxtst-dev libxt-dev zstd
      # Captions: whisper-cli and the checksummed English model into
      # vendor/whisper, which every package ships as resources/whisper. Linux
      # and macOS build it from the pinned source tarball; Windows takes
      # whisper.cpp's prebuilt zip of the same commit. `shell: bash` is Git Bash
      # on the Windows runner, which has curl, sha256sum and unzip.
      - run: bash scripts/fetch-whisper.sh
        shell: bash
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The one-command Linux install in the README downloads
      # releases/latest/download/ScreenPolish-installer.run. It is built here,
      # from this build's AppImage, under a name with no
      # version in it so that link keeps working release after release. v0.4.0
      # shipped without it and the README's install command returned 404.
      - if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # AppImage only. With the pacman package as well it was 659 MB, twice
          # the app, for a choice most people never see; Arch users can take the
          # .pacman beside it, and the installer works the same from the AppImage.
          bash scripts/make-installer.sh --app release/ScreenPolish-*.AppImage --out release
          mv release/ScreenPolish-*-installer.run release/ScreenPolish-installer.run
          release/ScreenPolish-installer.run --version
      - uses: actions/upload-artifact@v4
        with:
          name: screenpolish-${{ matrix.name }}
          # latest.yml and the installer's blockmap are what the Windows app's
          # updater reads to find and download a new version.
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.pacman
            release/*.run
          if-no-files-found: error

  # Attach the installers to the release from here, on GitHub's own network.
  #
  # They used to be downloaded to a maintainer's machine and uploaded back by
  # hand: about 2.3 GB each way. On a home connection that is an hour of
  # uploading, and three releases' worth of interruptions left one stuck as a
  # draft with three of its seven files. Doing it here takes minutes.
  #
  # The release is left as a draft. Nothing reaches users until someone has
  # looked at it and published it on purpose.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          # Create the draft if it does not exist yet; reuse it if it does, so a
          # rebuilt tag replaces its files rather than failing.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "Draft: installers attached by CI. Write the notes, then publish."
          # Checksums, so a download can be checked against what CI built.
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "attached $count files"
          # Seven installers for every platform and architecture, the Linux
          # one-command installer, the Windows updater's latest.yml and
          # blockmap, and the checksums. Fewer means something did not build,
          # and a release missing a platform should be noticed here, not by
          # the person who cannot download it.
          [ "$count" -ge 11 ] || { echo "expected 11 files, found $count"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'latest.yml' \
            || { echo "the Windows updater's latest.yml is missing"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'ScreenPolish-installer.run' \
            || { echo "the README's Linux installer is missing"; exit 1; }
